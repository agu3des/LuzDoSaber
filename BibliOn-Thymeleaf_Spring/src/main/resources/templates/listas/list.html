<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
    layout:decorate="~{layouts/principal}" th:with="titulo='Listas'">
  <body>
    <div layout:fragment="conteudo">

      <form th:action="@{/listas/form}" method="GET" 
        th:if="${session.usuario != null}">
        <button class="btn btn-primary" type="submit">Nova Lista</button>
      </form>
      <br />

      <div th:if="${not #lists.isEmpty(listas)}">
        <div th:text="'Total ' + ${#lists.size(listas)} + ' registros'" 
             style="text-align: right; color: gray; font-size: 0.85em" />

        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Número</th>
              <th>Descrição</th>
              <th>Correntista</th>
              <th>Tipo</th>
              <th style="text-align: center">Dia Fechamento</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="lista : ${listas}">
              <td>
                <a th:href="@{/listas/{id}(id=${lista.id})}" th:text="${lista.numero}"></a>
              </td>

              <td th:text="${lista.descricao}">[descrição]</td>

              <td th:text="${lista.usuario.nome}">[nome]</td>

              <td>
                <span th:if="${lista.tipo == 'CARTAO'}" class="badge bg-warning text-dark">Cartão</span>
                <span th:if="${lista.tipo == 'CORRENTE'}" class="badge bg-primary">Corrente</span>
              </td>

              <td style="text-align: center">
                <span th:if="${lista.tipo == 'CARTAO'}" th:text="${lista.diaFechamento}">[fechamento]</span>
                <span th:if="${lista.tipo != 'CARTAO'}">–</span>
              </td>

              <td>
                <div class="d-flex gap-1">
                <a th:href="@{/transacoes/listar/{id}(id=${lista.id})}" class="btn btn-outline-success btn-sm">Listar Transações</a>

                  <a th:href="@{/transacoes/nova/{id}(id=${lista.id})}" class="btn btn-outline-primary btn-sm">Nova Transação</a>

                  <!-- Exclusão apenas para admin -->
                  <form th:action="@{/listas/{id}/delete(id=${lista.id})}" method="GET" 
                    th:if="${session.usuario != null and session.usuario.admin}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Excluir</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:if="${#lists.isEmpty(listas)}" class="alert alert-info">
        Nenhuma lista cadastrada.
      </div>
    </div>
  </body>
</html>
